name: go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A run that only builds and checks has no business writing to the repository,
# and the token it gets by default can do more than that.
permissions:
  contents: read

# A new push to the same branch cancels the run before it, so the answer that
# arrives is about the code that is there now.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Format covers the fyne command too: gofmt needs no build.
      - name: format
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # Engine only. cmd/obxod-ui pulls in fyne (CGO, GL, Windows), which no
      # runner can build; it is Windows-only and checked by hand.
      - name: vet
        run: go vet ./cmd/obxod ./internal/...

      - name: build
        run: go build ./cmd/obxod ./internal/...

      - name: test
        run: go test ./cmd/obxod ./internal/...

      # Needs a C compiler, which the windows runner has no reason to carry.
      - name: race
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./cmd/obxod ./internal/...
